<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Player Create Helper</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f1e8;
        --panel: rgba(255, 252, 245, 0.9);
        --text: #221b15;
        --muted: #6f6256;
        --line: rgba(34, 27, 21, 0.12);
        --accent: #aa6d1a;
        --accent-strong: #8e560b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241d17;
          --panel: rgba(39, 31, 25, 0.94);
          --text: #f6efe6;
          --muted: #c4b5a3;
          --line: rgba(255, 241, 224, 0.12);
          --accent: #f2b24e;
          --accent-strong: #ffc66f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 18px;
        font: 13px/1.5 "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(237, 199, 138, 0.24), transparent 36%),
          linear-gradient(160deg, var(--bg), #ece5db 70%);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0;
      }

      .hint {
        color: var(--muted);
      }

      .block {
        margin-top: 18px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input[type="file"],
      input[type="number"],
      input[type="range"] {
        width: 100%;
      }

      input[type="file"] {
        padding: 10px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.32);
      }

      input[type="number"] {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.4);
        color: inherit;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .pill {
        min-width: 54px;
        padding: 6px 10px;
        border-radius: 999px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        background: rgba(170, 109, 26, 0.12);
        color: var(--accent-strong);
      }

      .list {
        max-height: 156px;
        overflow: auto;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.32);
      }

      .list li {
        padding: 9px 12px;
        border-top: 1px solid var(--line);
      }

      .list li:first-child {
        border-top: 0;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        height: 42px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 600;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.36);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .status {
        min-height: 20px;
        margin-top: 12px;
        color: var(--muted);
      }

      .status.error {
        color: #c73c3c;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Player Create Helper</h1>
      <p class="hint">先在画布里选中模板里的 <strong>cf-img</strong> 和 <strong>cf-bg</strong>，再一次导入多张专辑封面。</p>

      <div class="block">
        <label class="label">模板识别状态</label>
        <div class="list" style="padding: 12px;" id="selectionStatus">
          正在读取当前选区...
        </div>
      </div>

      <div class="block">
        <label class="label" for="files">专辑封面</label>
        <input id="files" type="file" accept="image/*" multiple />
        <p class="hint" id="fileCount">还没有选择图片。</p>
        <ul class="list" id="fileList"></ul>
      </div>

      <div class="block">
        <label class="label" for="rowGap">每组之间的纵向间距</label>
        <input id="rowGap" type="number" min="0" step="1" value="48" />
      </div>

      <div class="block">
        <label class="label" for="startIndex">起始编号（文件名为空时兜底）</label>
        <input id="startIndex" type="number" min="1" step="1" value="1" />
      </div>

      <div class="block">
        <label class="label" for="bgColorMix">右侧背景柔化程度</label>
        <div class="range-row">
          <input id="bgColorMix" type="range" min="0" max="80" step="1" value="22" />
          <div class="pill" id="bgColorMixValue">22%</div>
        </div>
        <p class="hint">数值越高，右侧背景会越柔和、更接近奶油底色。想要更深，建议先试 10% - 25%。</p>
      </div>

      <div class="actions">
        <button class="secondary" id="cancel">关闭</button>
        <button class="primary" id="generate">生成模板</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <script>
      const filesInput = document.getElementById("files");
      const fileCount = document.getElementById("fileCount");
      const fileList = document.getElementById("fileList");
      const rowGapInput = document.getElementById("rowGap");
      const startIndexInput = document.getElementById("startIndex");
      const bgColorMixInput = document.getElementById("bgColorMix");
      const bgColorMixValue = document.getElementById("bgColorMixValue");
      const statusEl = document.getElementById("status");
      const selectionStatusEl = document.getElementById("selectionStatus");
      const generateButton = document.getElementById("generate");
      const cancelButton = document.getElementById("cancel");

      filesInput.addEventListener("change", renderFiles);
      bgColorMixInput.addEventListener("input", () => {
        bgColorMixValue.textContent = `${bgColorMixInput.value}%`;
      });

      generateButton.addEventListener("click", async () => {
        const files = Array.from(filesInput.files || []);
        if (!files.length) {
          setStatus("请先选择专辑封面。", true);
          return;
        }

        setStatus("正在读取图片并计算颜色，请稍等...");
        generateButton.disabled = true;

        try {
          const payload = await Promise.all(files.map(prepareFile));

          parent.postMessage({
            pluginMessage: {
              type: "generate",
              files: payload,
              rowGap: Number(rowGapInput.value),
              startIndex: Number(startIndexInput.value),
              bgColorMix: Number(bgColorMixInput.value) / 100
            }
          }, "*");
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
          generateButton.disabled = false;
        }
      });

      cancelButton.addEventListener("click", () => {
        parent.postMessage({
          pluginMessage: {
            type: "cancel"
          }
        }, "*");
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) {
          return;
        }

        if (message.type === "done") {
          setStatus(message.summary, false);
          generateButton.disabled = false;
        }

        if (message.type === "error") {
          setStatus(message.message, true);
          generateButton.disabled = false;
        }

        if (message.type === "selection-status") {
          selectionStatusEl.textContent = message.ok
            ? message.summary
            : `${message.summary} ${message.message}`;
        }
      };

      function renderFiles() {
        const files = Array.from(filesInput.files || []);
        if (!files.length) {
          fileCount.textContent = "还没有选择图片。";
          fileList.innerHTML = "";
          return;
        }

        fileCount.textContent = `已选择 ${files.length} 张专辑封面。`;
        fileList.innerHTML = files
          .slice(0, 12)
          .map((file) => `<li>${escapeHtml(file.name)}</li>`)
          .join("");

        if (files.length > 12) {
          fileList.innerHTML += `<li>... 另有 ${files.length - 12} 张</li>`;
        }
      }

      async function prepareFile(file) {
        const imageBytes = await getFigmaCompatibleBytes(file);
        const color = await extractDominantColor(file);

        return {
          name: file.name,
          bytes: Array.from(imageBytes),
          color
        };
      }

      async function getFigmaCompatibleBytes(file) {
        if (isWebpFile(file)) {
          return await convertImageFileToPngBytes(file);
        }

        const buffer = await file.arrayBuffer();
        return new Uint8Array(buffer);
      }

      function isWebpFile(file) {
        const mimeType = String(file.type || "").toLowerCase();
        const filename = String(file.name || "").toLowerCase();
        return mimeType === "image/webp" || filename.endsWith(".webp");
      }

      async function convertImageFileToPngBytes(file) {
        const bitmap = await createImageBitmap(file);
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        const context = canvas.getContext("2d");
        context.drawImage(bitmap, 0, 0);
        bitmap.close();

        const pngBlob = await canvasToBlob(canvas, "image/png");
        const pngBuffer = await pngBlob.arrayBuffer();
        return new Uint8Array(pngBuffer);
      }

      function canvasToBlob(canvas, type) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("WEBP 转 PNG 失败，请改用 PNG 或 JPG 后重试。"));
              return;
            }

            resolve(blob);
          }, type);
        });
      }

      async function extractDominantColor(file) {
        const bitmap = await createImageBitmap(file);
        const maxSide = 56;
        const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
        const width = Math.max(1, Math.round(bitmap.width * scale));
        const height = Math.max(1, Math.round(bitmap.height * scale));

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(bitmap, 0, 0, width, height);
        bitmap.close();

        const { data } = context.getImageData(0, 0, width, height);
        const buckets = new Map();
        let avgR = 0;
        let avgG = 0;
        let avgB = 0;
        let avgWeight = 0;

        for (let i = 0; i < data.length; i += 4) {
          const alpha = data[i + 3] / 255;
          if (alpha < 0.4) {
            continue;
          }

          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const { saturation, value } = rgbToHsv(r, g, b);
          const isNeutral = saturation < 0.12 && value > 0.94;
          if (isNeutral) {
            continue;
          }

          const weight = Math.max(0.35, saturation * 1.2 + value * 0.25) * alpha;
          avgR += r * weight;
          avgG += g * weight;
          avgB += b * weight;
          avgWeight += weight;

          const key = `${Math.round(r / 24)}-${Math.round(g / 24)}-${Math.round(b / 24)}`;
          const bucket = buckets.get(key) || {
            total: 0,
            r: 0,
            g: 0,
            b: 0
          };

          bucket.total += weight;
          bucket.r += r * weight;
          bucket.g += g * weight;
          bucket.b += b * weight;
          buckets.set(key, bucket);
        }

        if (!buckets.size || !avgWeight) {
          return { r: 0.7, g: 0.7, b: 0.7 };
        }

        let best = null;
        for (const bucket of buckets.values()) {
          if (!best || bucket.total > best.total) {
            best = bucket;
          }
        }

        const dominant = {
          r: best.r / best.total / 255,
          g: best.g / best.total / 255,
          b: best.b / best.total / 255
        };

        const average = {
          r: avgR / avgWeight / 255,
          g: avgG / avgWeight / 255,
          b: avgB / avgWeight / 255
        };

        return {
          r: dominant.r * 0.75 + average.r * 0.25,
          g: dominant.g * 0.75 + average.g * 0.25,
          b: dominant.b * 0.75 + average.b * 0.25
        };
      }

      function rgbToHsv(r, g, b) {
        const nr = r / 255;
        const ng = g / 255;
        const nb = b / 255;
        const max = Math.max(nr, ng, nb);
        const min = Math.min(nr, ng, nb);
        const delta = max - min;
        const saturation = max === 0 ? 0 : delta / max;

        return {
          saturation,
          value: max
        };
      }

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (char) => {
          const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
          };
          return map[char];
        });
      }
    </script>
  </body>
</html>
